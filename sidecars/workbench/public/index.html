<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Workbench</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link id="hljs-theme" rel="stylesheet" href="/vendor/hljs-dark.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Top compact workbench toolbar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand" data-i18n-title="brandTitle" title="Split Workbench">
          <svg class="brand-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1.5" y="2" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/>
            <line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.3"/>
            <line x1="8" y1="8.5" x2="14.5" y2="8.5" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </div>

        <button id="btn-add-file" class="tb-btn" type="button" data-i18n-title="btnFileTitle" title="Open workspace file (⌘P)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.2L13 5.3V14a.5.5 0 0 1-.5.5h-8A.5.5 0 0 1 4 14V2a.5.5 0 0 1 .5-.5z" stroke="currentColor" stroke-width="1.3"/><path d="M9 1.5V5.5H13" stroke="currentColor" stroke-width="1.3"/></svg>
          <span data-i18n="btnFile">File</span>
        </button>

        <button id="btn-add-web" class="tb-btn" type="button" data-i18n-title="btnWebTitle" title="Open web preview">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><ellipse cx="8" cy="8" rx="2.8" ry="6" stroke="currentColor" stroke-width="1.2"/><line x1="2.2" y1="8" x2="13.8" y2="8" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="btnWeb">Web</span>
        </button>

        <button id="btn-add-term" class="tb-btn" type="button" data-i18n-title="btnTermTitle" title="Open interactive terminal">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 6.2 7 8.2 4.5 10.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="8.2" y1="10.2" x2="11.5" y2="10.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span data-i18n="btnTerm">Terminal</span>
        </button>

        <button id="btn-add-artifact" class="tb-btn" type="button" data-i18n-title="btnArtifactTitle" title="Open session artifacts">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h10a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5z" stroke="currentColor" stroke-width="1.3"/><line x1="5" y1="5.8" x2="11" y2="5.8" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="8.3" x2="11" y2="8.3" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="10.8" x2="8.5" y2="10.8" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="btnArtifact">Artifacts</span>
        </button>
      </div>

      <div class="topbar-right">
        <button id="btn-chat-links" class="tb-btn tb-accent" type="button" data-i18n-title="btnChatLinksTitle" title="Files & links from chat">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3M5.3 7.5L3.9 8.9a2.5 2.5 0 1 0 3.5 3.5l1.4-1.4M10.7 8.5l1.4-1.4a2.5 2.5 0 1 0-3.5-3.5L7.2 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span data-i18n="btnChatLinks">Chat Links</span>
          <span id="chat-links-badge" class="badge hidden">0</span>
        </button>

        <div class="split-mode-group" role="group" aria-label="Split mode">
          <button class="sm-btn active" data-split-mode="auto" type="button" data-i18n="splitAuto" data-i18n-title="splitAutoTitle">Auto</button>
          <button class="sm-btn" data-split-mode="horizontal" type="button" data-i18n-title="splitHorizTitle">◫</button>
          <button class="sm-btn" data-split-mode="vertical" type="button" data-i18n-title="splitVertTitle">⬓</button>
        </div>

        <button id="btn-reset-ratios" class="tb-icon-btn" type="button" data-i18n-title="resetRatiosTitle" title="Reset all splits to 50/50">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1.8" stroke="currentColor" stroke-width="1.3"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.2"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </header>

    <!-- Main flat BSP stage (absolute geometry keeps iframes & PTY terminals alive across splits/swaps!) -->
    <main id="stage" class="stage" tabindex="-1"></main>

    <!-- Transparent shield active during divider resize or header drag so iframes never steal pointer events -->
    <div id="drag-shield" class="drag-shield hidden"></div>
  </div>

  <!-- Quick File Picker Modal (Cmd/Ctrl+P or + File) -->
  <div id="file-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Open file">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-search-wrap">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="file-search-input" type="text" data-i18n-placeholder="fileSearchPlaceholder" placeholder="Search file name or path..." autocomplete="off">
        </div>
        <button id="file-modal-close" class="icon-btn" type="button" data-i18n-title="close" title="Close (Esc)">✕</button>
      </div>
      <div class="modal-subbar">
        <div id="file-breadcrumb" class="breadcrumb"></div>
        <div id="file-ws-switcher" class="ws-switcher"></div>
      </div>
      <div id="file-list" class="modal-list"></div>
      <div class="modal-foot">
        <span id="file-split-hint" class="muted"></span>
        <span class="spacer"></span>
        <label class="inline-check"><input id="file-replace-mode" type="checkbox"> <span data-i18n="replaceCurrent">Replace active pane</span></label>
      </div>
    </div>
  </div>

  <!-- Chat Links Popover -->
  <div id="chat-links-popover" class="popover hidden" role="dialog" aria-label="Chat links">
    <div class="popover-head">
      <span class="popover-title" data-i18n="chatLinksHeader">Files &amp; Links from Chat</span>
      <span class="spacer"></span>
      <label class="inline-check" data-i18n-title="autoOpenChatTitle">
        <input id="auto-open-chat-links" type="checkbox"> <span data-i18n="autoOpenChat">Auto-split</span>
      </label>
      <button id="chat-links-refresh" class="icon-btn" type="button" data-i18n-title="refresh" title="Refresh">↻</button>
    </div>
    <div id="chat-links-body" class="popover-body"></div>
  </div>

  <!-- Per-Pane Color Picker Popover -->
  <div id="color-popover" class="color-popover hidden" role="dialog" aria-label="Pane color">
    <div id="color-swatches" class="color-swatches"></div>
    <div class="color-popover-foot">
      <label class="color-custom-btn" data-i18n-title="customColorTitle">
        <span data-i18n="customColor">🎨 Custom</span>
        <input id="color-custom-input" type="color" value="#3b82f6">
      </label>
      <button id="color-clear-btn" class="qp-btn" type="button" data-i18n="clearColor">None</button>
    </div>
  </div>

  <!-- Floating Selection Quote Toolbar -->
  <div id="quote-popover" class="quote-popover hidden" role="toolbar" aria-label="Quote selection">
    <span id="quote-loc" class="quote-loc"></span>
    <button id="quote-btn-send" class="qp-btn primary" type="button" data-i18n="quoteBtn" data-i18n-title="quoteBtnTitle">❝ Quote</button>
    <button id="quote-btn-comment" class="qp-btn" type="button" data-i18n="quoteCommentBtn" data-i18n-title="quoteCommentBtnTitle">💬 Comment</button>
    <button id="quote-btn-copy" class="qp-btn" type="button" data-i18n="quoteCopyBtn" data-i18n-title="quoteCopyBtnTitle">📋 Copy</button>
  </div>

  <!-- Selection-to-Chat Floating Comment Bar -->
  <div id="comment-bar" class="comment-bar hidden">
    <div id="comment-preview" class="comment-preview"></div>
    <div class="comment-bar-row">
      <input id="comment-input" type="text" data-i18n-placeholder="commentPlaceholder" placeholder="Ask a question or add a note...">
      <button id="comment-send" class="qp-btn" type="button" data-i18n="commentAttach" data-i18n-title="commentAttachTitle">Attach</button>
      <button id="comment-send-now" class="primary-btn sm" type="button" data-i18n="commentSendNow" data-i18n-title="commentSendNowTitle">Send Now</button>
      <button id="comment-cancel" class="icon-btn" type="button">✕</button>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/layout.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
